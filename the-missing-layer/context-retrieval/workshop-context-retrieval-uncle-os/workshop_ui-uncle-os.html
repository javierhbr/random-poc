                ],
                demo: `Distribute the 7-step sequence. Deliver the closing line: <em>"The different OS layers organize knowledge; the Context Retrieval Process is the mechanism that finds it and puts it into context to solve a task."</em>`
            }
        ];

        const navContainer = document.getElementById('nav-container');
        const contentContainer = document.getElementById('content-container');
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        
        let activeModuleId = workshopData[0].id;

        function renderNavigation() {
            navContainer.innerHTML = workshopData.map((module, index) => {
                const isActive = module.id === activeModuleId;
                
                // Parse the title to format "Intro" vs "Module X"
                const titleParts = module.title.split(': ');
                const preTitle = titleParts.length > 1 ? titleParts[0] : module.title;
                const mainTitle = titleParts.length > 1 ? titleParts.slice(1).join(': ') : '';

                return `
                    <button onclick="selectModule('${module.id}')" 
                        class="w-full text-left px-3 py-3 rounded-xl flex items-center gap-3 transition-all duration-200 group relative overflow-hidden ${isActive ? 'bg-brand-50 shadow-sm border border-brand-100' : 'hover:bg-slate-100 text-slate-600 border border-transparent'}">
                        ${isActive ? '<div class="absolute left-0 top-0 bottom-0 w-1.5 bg-brand-500 rounded-r-full"></div>' : ''}
                        <div class="${isActive ? 'text-brand-600' : 'text-slate-400 group-hover:text-brand-500 transition-colors'}">
                            <i class="ph-fill ${module.icon} text-xl"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="text-xs font-bold uppercase tracking-wider ${isActive ? 'text-brand-600' : 'text-slate-500'}">${preTitle}</div>
                            ${mainTitle ? `<div class="text-sm font-semibold truncate ${isActive ? 'text-brand-900' : 'text-slate-700'}">${mainTitle}</div>` : ''}
                        </div>
                    </button>
                `;
            }).join('');
        }

        function renderContent() {
            const module = workshopData.find(m => m.id === activeModuleId);
            if (!module) return;

            // Trigger reflow for animation
            contentContainer.classList.remove('fade-enter-active');
            void contentContainer.offsetWidth; 
            contentContainer.classList.add('fade-enter');

            contentContainer.innerHTML = `
                <div class="mb-8">
                    <div class="inline-flex items-center justify-center h-16 w-16 rounded-2xl bg-white border border-slate-200 shadow-sm mb-6">
                        <i class="ph-fill ${module.icon} text-3xl text-brand-600"></i>
                    </div>
                    <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight mb-4">${module.title}</h1>
                </div>

                <section class="bg-gradient-to-br from-brand-50 to-white border border-brand-200 rounded-2xl p-6 md:p-8 mb-10 shadow-sm relative overflow-hidden">
                    <div class="absolute top-0 right-0 -mt-4 -mr-4 text-brand-100 hidden md:block">
                        <i class="ph-fill ph-target text-9xl"></i>
                    </div>
                    <h2 class="text-brand-700 font-bold uppercase tracking-widest text-sm flex items-center gap-2 mb-3 relative z-10">
                        <i class="ph-bold ph-crosshair"></i> Objective
                    </h2>
                    <p class="text-lg md:text-xl text-slate-800 font-medium leading-relaxed relative z-10">${module.objective}</p>
                </section>
                
                <!-- Architecture Diagram Injection -->
                ${module.diagram ? `
                <section class="mb-12">
                    <h2 class="text-xl font-bold text-slate-900 mb-6 flex items-center gap-2 border-b border-slate-200 pb-3">
                        <i class="ph-fill ph-blueprint text-brand-500"></i> Architecture Map
                    </h2>
                    ${module.diagram}
                </section>
                ` : ''}

                <section class="mb-12">
                    <h2 class="text-xl font-bold text-slate-900 mb-6 flex items-center gap-2 border-b border-slate-200 pb-3">
                        <i class="ph-fill ph-brain text-brand-500"></i> Key Concepts
                    </h2>
                    <div class="space-y-6">
                        ${module.concepts.map(concept => `
                            <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm hover:border-slate-300 transition-colors">
                                <h3 class="text-lg font-bold text-brand-800 mb-4">${concept.title}</h3>
                                <div class="text-slate-700 leading-relaxed text-sm md:text-base">
                                    ${concept.content}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </section>

                <section class="bg-emerald-50 border border-emerald-100 rounded-2xl overflow-hidden shadow-sm">
                    <div class="bg-emerald-100/50 border-b border-emerald-100 px-6 py-4 flex items-center gap-3">
                        <i class="ph-fill ph-terminal-window text-emerald-600 text-xl"></i>
                        <h2 class="text-emerald-900 font-bold">Demo Scenario</h2>
                    </div>
                    <div class="p-6 md:p-8">
                        <p class="text-emerald-900 text-lg leading-relaxed italic border-l-4 border-emerald-400 pl-4 py-1">
                            ${module.demo}
                        </p>
                    </div>
                </section>
            `;

            setTimeout(() => {
                contentContainer.classList.replace('fade-enter', 'fade-enter-active');
            }, 10);
        }

        window.selectModule = function(id) {
            activeModuleId = id;
            renderNavigation();
            renderContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // Close mobile menu if open
            if (window.innerWidth < 768) {
                toggleMobileMenu(false);
            }
        };

        function toggleMobileMenu(forceState) {
            const isOpen = sidebar.classList.contains('translate-x-0');
            const newState = forceState !== undefined ? forceState : !isOpen;
            
            if (newState) {
                sidebar.classList.remove('-translate-x-full');
                sidebar.classList.add('translate-x-0');
                sidebarOverlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                sidebar.classList.remove('translate-x-0');
                sidebarOverlay.classList.add('hidden');
            }
        }

        mobileMenuBtn.addEventListener('click', () => toggleMobileMenu());
        sidebarOverlay.addEventListener('click', () => toggleMobileMenu(false));

        // Initial Render
        renderNavigation();
        renderContent();

    </script>
</body>
</html>
